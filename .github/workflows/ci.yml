name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Build + Test + Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Aggregated fitness report (architecture, ratchet debt, coverage,
      # mutation scores) → job summary.
      - run: pnpm fitness

  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - uses: Miragon/pin-npm-dependencies@v1.2.1

  mutation:
    name: Mutation (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # mutation-diff.mjs diffs against the merge-base with the PR base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cross-package imports in the suites resolve via each package's dist.
      - run: pnpm build

      - run: node scripts/mutation-diff.mjs origin/${{ github.base_ref }}

  template:
    name: Composed-server template (Build + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packs the workspace packages and runs the template against the
      # tarballs — the gate that templates/composed-server keeps compiling
      # against what the release train will publish.
      - run: ./scripts/test-template.sh

  kotlin:
    name: Kotlin (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-plugins
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

  cibseven-example:
    name: CIB Seven Example (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground/cibseven-example
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
