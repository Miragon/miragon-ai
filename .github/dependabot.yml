# Grouping rule: patch + minor updates travel together per ecosystem, major updates get
# their own pull request. A single breaking major otherwise turns the whole group red and
# blocks every harmless bump in it (see #193: mcp-use 2, TypeScript 6, ESLint 10 and 25
# more in one unmergeable PR).
version: 2
updates:
  # npm dependencies (pnpm monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # majors arrive as individual PRs — leave room next to the grouped one
    open-pull-requests-limit: 10
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      # The toolkit peers `mcp-use` EXACTLY (toolkit 2.1.0 → mcp-use 2.2.3), and the
      # composed-server template pins both by hand — a lone `mcp-use` bump therefore
      # always lands with an unmet peer and a red `scripts/test-template.sh` drift gate
      # (see #270). Keep the pair in its own PR so it stays a deliberate joint bump and
      # does not drag the rest of the group into the red. Listed FIRST: Dependabot
      # assigns a dependency to the first group it matches.
      mcp-toolkit:
        patterns:
          - "mcp-use"
          - "@miragon/mcp-toolkit-*"
        update-types:
          - "patch"
          - "minor"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "mcp-use"
          - "@miragon/mcp-toolkit-*"
        update-types:
          - "patch"
          - "minor"

  # Gradle / Kotlin plugins
  - package-ecosystem: "gradle"
    directory: "/engine-plugins"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      gradle-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker images — playground: compose stack, Fly variants, engine
  - package-ecosystem: "docker"
    directories:
      - "/playground/docker"
      - "/playground/docker/otel"
      - "/playground/docker/prometheus"
      - "/playground/docker/grafana"
      - "/playground/cibseven-example"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-dependencies:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Docker image — root Dockerfile (server), keeps the pinned base digest current
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "dominikhorn93"
      - "emaarco"
    groups:
      docker-root:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
