name: miragon-ai

services:
  # Default: custom-built CIB Seven with the OTEL metrics plugin.
  # Identifies itself as `prod-a` via the `engine_id` metric attribute.
  cibseven:
    build:
      context: ../cibseven-example
      dockerfile: Dockerfile
    ports:
      - "8410:8410"
    environment:
      - SPRING_PROFILES_ACTIVE=seed-presentation
      - METRICS_ENABLED=true
      - ENGINE_ID=prod-a
      # Continuous real-time traffic so the metric-first analytics populate
      # out of the box (set false to rely on the backdated seed only).
      - LIVE_TRAFFIC_ENABLED=true
      - OTEL_SERVICE_NAME=cibseven-engine-a
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=15000
      # Traces are no longer collected (no Collector traces pipeline); stop the
      # agent shipping spans that would only be dropped. Metrics stay on.
      - OTEL_TRACES_EXPORTER=none
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8410/engine-rest/engine || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Second engine on port 8411, identifying as `prod-b`. Opt-in via the
  # `multi-engine` profile so the default `docker compose up` keeps the existing
  # single-engine setup unchanged.
  # Use: docker compose --profile multi-engine up -d
  cibseven-b:
    profiles: [multi-engine]
    build:
      context: ../cibseven-example
      dockerfile: Dockerfile
    ports:
      - "8411:8410"
    environment:
      - SPRING_PROFILES_ACTIVE=seed-presentation
      - METRICS_ENABLED=true
      - ENGINE_ID=prod-b
      - LIVE_TRAFFIC_ENABLED=true
      - OTEL_SERVICE_NAME=cibseven-engine-b
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=15000
      # Traces are no longer collected (no Collector traces pipeline); stop the
      # agent shipping spans that would only be dropped. Metrics stay on.
      - OTEL_TRACES_EXPORTER=none
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8410/engine-rest/engine || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Dev: plain CIB Seven image, no custom build
  # Use: docker compose --profile dev up
  cibseven-dev:
    profiles: [dev]
    image: cibseven/cibseven:run-latest
    ports:
      - "8410:8080"
    environment:
      - CIBSEVEN_BPM_RUN_AUTH_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/engine-rest/engine || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # OpenTelemetry Collector — receives OTLP from the engines, serves process
  # metrics for Prometheus to scrape (:9464). Sole export path of the
  # metric-first analytics stack.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - DEPLOY_ENV=docker-local
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "8430:4317" # OTLP gRPC
      - "8431:4318" # OTLP HTTP
      - "8450:8888" # Collector's own telemetry
      - "8451:9464" # Prometheus exporter (process metrics)

  # Prometheus — scrapes the Collector's process metrics.
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "8460:9090" # Prometheus UI
    depends_on:
      - otel-collector

  # Grafana — process-analytics dashboards over Prometheus. Anonymous admin so
  # the demo opens straight onto the provisioned dashboards.
  grafana:
    image: grafana/grafana:11.4.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=light
    ports:
      - "8470:3000" # Grafana UI
    depends_on:
      - prometheus

  # Postgres — durable user settings + saved dashboards for the MCP server
  # (opt-in via DATABASE_URL). Default profile so a locally-run server
  # (`pnpm dev`) reaches it on localhost:8440. The init script creates a
  # second database for the opt-in `pnpm test:pg` suites, so tests never touch
  # the playground's own data. demo-grade credentials, matching demo/demo.
  postgres:
    image: postgres:18.1-alpine
    environment:
      - POSTGRES_USER=miragon
      - POSTGRES_PASSWORD=miragon
      - POSTGRES_DB=miragon
    volumes:
      # The 18+ image keeps PGDATA in a versioned subdirectory of
      # /var/lib/postgresql — mount the parent, not .../data.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "8440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miragon -d miragon"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Keycloak — the local IdP for the server's opt-in OAuth (MCP_OAUTH,
  # provider "oidc-proxy": the server brokers MCP-client logins through its
  # own /authorize + /token + /register with the pre-registered
  # `miragon-ai-server` client). Opt-in via the `auth` profile — the plain
  # `docker compose up` stays auth-free; with the profile a locally-run
  # server reaches it on localhost:8480. `--import-realm` seeds the `miragon` realm
  # (client + demo/demo user) from ./keycloak/realm-miragon.json on first
  # boot. KC_HOSTNAME pins the issuer to the HOST url so tokens verify no
  # matter how the container is reached. Admin console: localhost:8480
  # (admin/admin, demo-grade like the rest of the stack).
  # Use: docker compose --profile auth up -d
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=http://localhost:8480
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
    volumes:
      # No data volume ON PURPOSE: the image runs as uid 1000 and cannot chown
      # a root-owned named volume, and the realm file IS the source of truth —
      # a recreated container simply re-imports it (admin-console experiments
      # are ephemeral, like the rest of the demo stack).
      - ./keycloak/realm-miragon.json:/opt/keycloak/data/import/realm-miragon.json:ro
    ports:
      - "8480:8080"
    healthcheck:
      # The distroless-ish image ships no curl; the management port answers
      # /health/ready once the realm import finished.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Automation MCP server (Node). Opt-in via the `full` profile so the
  # default `docker compose up` brings up infra only — leaving port 8400
  # free for a locally-run server (`pnpm -F @miragon-ai/mcp-server-camunda7 dev`).
  # Use: docker compose --profile full up -d
  mcp-server:
    profiles: [full]
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8400:8400"
    environment:
      - PORT=8400
      # Pass either a single CAMUNDA_BASE_URL (back-compat, single engine) OR
      # CAMUNDA_ENGINES_JSON with a list. Below: single-engine default; for
      # multi-engine override by exporting CAMUNDA_ENGINES_JSON in the host
      # shell before `docker compose up`, or by overriding via a compose
      # override file.
      - CAMUNDA_BASE_URL=http://cibseven:8410/engine-rest
      - CAMUNDA_COCKPIT_URL=http://localhost:8410/webapp
      - CAMUNDA_AUTH_TYPE=basic
      - CAMUNDA_USERNAME=demo
      - CAMUNDA_PASSWORD=demo
      - PROMETHEUS_URL=http://prometheus:9090
      # Durable user settings + dashboards (src/persistence/ in the server app).
      - DATABASE_URL=postgres://miragon:miragon@postgres:5432/miragon
    depends_on:
      cibseven:
        condition: service_healthy
      prometheus:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').createConnection(8400,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

volumes:
  prometheus-data:
  postgres-data:
