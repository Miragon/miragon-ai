name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (Build + Test + Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Handed to the `fitness` job, which owns the aggregated report. Both
      # globs split at the repo root, so the artifact keeps the apps/ and
      # packages/ prefixes and unpacks over the checkout as-is.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-summaries
          path: |
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - uses: Miragon/pin-npm-dependencies@v1.2.1

  mutation:
    name: Mutation (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # mutation-diff.mjs diffs against the merge-base with the PR base.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cross-package imports in the suites resolve via each package's dist.
      - run: pnpm build

      - run: node scripts/mutation-diff.mjs origin/${{ github.base_ref }}

      # Only packages/* carry a stryker.config.json, so the artifact root is
      # `packages` — the fitness job unpacks it there again. Uploaded even on a
      # red gate so the report still shows the score that failed.
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mutation-reports
          path: packages/*/reports/mutation-report.json
          if-no-files-found: ignore
          retention-days: 1

  # Aggregated fitness report (architecture, ratchet debt, coverage, mutation
  # scores) → job summary. Separate job because coverage and mutation scores
  # are produced by two different jobs; it consumes both as artifacts.
  fitness:
    name: Fitness report
    needs: [typescript, mutation]
    if: always() && needs.typescript.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # depcruise resolves workspace imports through each package's dist; an
      # unbuilt tree would report "0 violations" it never actually measured.
      - run: pnpm build

      - uses: actions/download-artifact@v8.0.1
        with:
          name: coverage-summaries

      # Absent on push-to-main runs, where the mutation job does not run at all.
      - if: needs.mutation.result == 'success' || needs.mutation.result == 'failure'
        uses: actions/download-artifact@v8.0.1
        with:
          name: mutation-reports
          path: packages

      - run: pnpm fitness

  template:
    name: Composed-server template (Build + Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packs the workspace packages and runs the template against the
      # tarballs — the gate that templates/composed-server keeps compiling
      # against what the release train will publish.
      - run: ./scripts/test-template.sh

  kotlin:
    name: Kotlin (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-plugins
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

  cibseven-example:
    name: CIB Seven Example (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground/cibseven-example
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false
