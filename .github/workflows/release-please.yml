name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: "Dry run (build & verify only — no PR, no release, no publish)"

permissions:
  contents: write # release-please commits + tags; publish checks out the repo
  pull-requests: write # release-please opens/updates the Release PR
  issues: write # release-please manages release labels
  packages: write # publish-to-maven publishes to GitHub Packages
  id-token: write # image provenance/SBOM attestation in publish-to-docker

jobs:
  release-please:
    name: Open or update Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      paths_released: ${{ steps.rp.outputs.paths_released }}
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - id: rp
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: ${{ inputs.dry_run || false }}
          skip-github-release: ${{ inputs.dry_run || false }}

  gate:
    name: Await release approval
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.dry_run == true }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Approved
        run: echo "Release approved — proceeding to publish."

  publish-maven:
    name: Publish engine plugins to GitHub Packages
    needs: gate
    uses: ./.github/workflows/publish-to-maven.yml
    secrets: inherit
    with:
      dry_run: ${{ inputs.dry_run == true }}

  publish-docker:
    name: Publish server image to Docker Hub
    needs: [release-please, gate]
    uses: ./.github/workflows/publish-to-docker.yml
    secrets: inherit
    with:
      dry_run: ${{ inputs.dry_run == true }}
      version: ${{ needs.release-please.outputs.tag_name }}

  publish-npm:
    name: Publish ${{ matrix.package }} to npm
    needs: [release-please, gate]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - client-camunda7
          - client-analytics
          - widget-shell
          - mcp-camunda7
          - mcp-analytics
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: ${{ matrix.package }}

  # After (not alongside) publish-npm: the mirror commits the release's pins
  # plus a lockfile resolved from the public registry, so syncing before the
  # packages are live would push an uninstallable template.
  sync-template-mirror:
    name: Sync composed-server template mirror
    needs: [release-please, publish-npm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/sync-template-mirror.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
